[package]
name = "beardrive-desktop"
version = "0.1.0"
description = "BearDrive Desktop — your synced projects, on your Mac"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
ureq = { version = "2", features = ["json"] }

[profile.release]
strip = true
